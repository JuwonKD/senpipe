<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/output.css" />
    <title>Zitra Pay</title>
  </head>
  <body class="ml-15 mt-0 font-poppins ">
    <main
      class="
        min-h-screen
        grid
        grid-cols-1
        lg:grid-cols-2
        items-center
        gap-8
        px-6
        py-10
        lg:px-16
        lg:py-0
    "
    >

    <!-- LEFT SIDE -->

      <section
        class="
            flex
            w-full
            justify-center
            lg:justify-start
        "
      >

          <div
            class="
                w-full
                max-w-[405px]
            "
          >

            <!-- Logo -->

            <img
                src="/images/logo.png"
                alt="Zitra Pay Logo"
                class="
                    h-auto
                    w-[60px]
                    mb-10
                "
            >


            <!-- Heading -->

            <h1
                class="
                    mb-7
                    text-[28px]
                    font-semibold
                    text-[#35383e]
                "
            >
                Log In
            </h1>


            <!-- Form -->

            <form>

                <!-- Email -->

                <div class="mb-5">

                    <label
                        for="email"
                        class="
                            mb-2
                            block
                            text-[15px]
                            text-[#4b4f56]
                        "
                    >
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="placeholder@mail.com"

                        class="
                            h-[48px]
                            w-full

                            rounded-[10px]

                            border
                            border-[#60B748]

                            bg-white

                            px-4

                            text-[15px]

                            outline-none

                            placeholder:text-gray-400

                            focus:ring-2
                            focus:ring-[#60B748]/20
                        "
                    >

                </div>


                <!-- Password -->

                <div class="mb-2">

                    <label
                        for="password"
                        class="
                            mb-2
                            block
                            text-[15px]
                            text-[#4b4f56]
                        "
                    >
                        Password
                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="password"

                            class="
                                h-[48px]
                                w-full

                                rounded-[10px]

                                border
                                border-gray-300

                                bg-white

                                px-4
                                pr-12

                                outline-none

                                focus:border-[#60B748]

                                focus:ring-2
                                focus:ring-[#60B748]/20
                            "
                        >


                        <!-- Password eye -->

                        <button
                            type="button"
                            id="toggle-password"

                            class="
                                absolute

                                right-3

                                top-1/2

                                -translate-y-1/2

                                text-gray-400
                            "
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Forgot password -->

                <a
                    href="/forgot-password.html"

                    class="
                        mb-9

                        inline-block

                        text-[15px]

                        text-[#4E963D]

                        hover:underline
                    "
                >
                    Forgot your password?
                </a>


                <!-- Login button -->
            
                <button
                    type="submit"
                    id="loginBtn"
                    class="
                        h-[50px]
                        w-full

                        rounded-[12px]

                        bg-[#60B748]

                        text-[15px]

                        font-semibold

                        text-white

                        transition

                        hover:bg-[#519F3D]
                    "
                >
                  Login
                </button>
              

                <!-- Sign up -->

                <p
                    class="
                        mt-5

                        text-center

                        text-[13px]

                        text-[#35383e]
                    "
                >

                    New to ZitraPay?

                    <a
                        href="/signup.html"

                        class="
                            ml-1

                            text-[#4E963D]

                            hover:underline
                        "
                    >
                        Sign up
                    </a>

                </p>

            </form>

          </div>

    </section>


    <!-- RIGHT SIDE -->

    <section
        class="
            flex
            w-full
            items-center
            justify-center
        "
    >

        <img
            src="/images/right side.png"
            alt="Zitra Pay Illustration"

            class="
                h-auto
                w-full
                max-w-[650px]

                rounded-2xl

                object-contain
            "
        >

      </section>

    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
