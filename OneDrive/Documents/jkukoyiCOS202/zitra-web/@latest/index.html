<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/output.css" />
    <title>Zitra Pay</title>
  </head>
  <body class="m-0 font-poppins  text-[#35383e] antialiased">
    <main class="min-h-screen grid grid-cols-1 lg:grid-cols-2 items-center">

      <!-- LEFT SIDE: Form Container -->
      <section class="relative flex w-full h-full items-center justify-center px-6 py-12 lg:px-16 overflow-hidden bg-white">
      

        <div class="relative z-10 w-full max-w-[405px]">

          <!-- Logo -->
          <img
            src="/images/logo.png"
            alt="Zitra Pay Logo"
            class="h-auto w-[60px] mb-10 transition-transform duration-300 hover:scale-105"
          />

          <!-- Heading -->
          <h1 class="mb-7 text-[30px] font-bold tracking-tight text-[#35383e]">
            Log In
          </h1>

          <!-- Form -->
          <form onsubmit="event.preventDefault();">

            <!-- Email Field -->
            <div class="mb-5">
              <label for="email" class="mb-2 block text-[14px] font-medium text-[#4b4f56]">
                Email Address
              </label>

              <div class="relative rounded-[10px] shadow-sm">
                <!-- Mail Icon -->
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <input
                  type="email"
                  id="email"
                  placeholder="placeholder@mail.com"
                  class="h-[48px] w-full rounded-[10px] border border-gray-200 bg-white pl-11 pr-4 text-[14px] text-gray-800 outline-none placeholder:text-gray-400 transition-all focus:border-[#60B748] focus:ring-2 focus:ring-[#60B748]/20"
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
              <label for="password" class="mb-2 block text-[14px] font-medium text-[#4b4f56]">
                Password
              </label>

              <div class="relative rounded-[10px] shadow-sm">
                <!-- Lock Icon -->
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </div>
                <input
                  type="password"
                  id="password"
                  placeholder="••••••••"
                  class="h-[48px] w-full rounded-[10px] border border-gray-200 bg-white pl-11 pr-12 text-[14px] text-gray-800 outline-none placeholder:text-gray-400 transition-all focus:border-[#60B748] focus:ring-2 focus:ring-[#60B748]/20"
                />

                <!-- Toggle Password Visibility Button -->
                <button
                  type="button"
                  id="toggle-password"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                >
                  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="mb-7 flex justify-start">
              <a
                href="/forgot-password.html"
                class="text-[14px] font-medium text-[#4E963D] hover:text-[#3d7730] hover:underline transition-colors"
              >
                Forgot your password?
              </a>
            </div>

            <!-- Login Button -->
            <button
              type="submit"
              onclick="window.location.href='/login.html'"
              class="h-[50px] w-full rounded-[12px] bg-[#60B748] text-[15px] font-semibold text-white shadow-md shadow-[#60B748]/20 transition-all hover:bg-[#519F3D] hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#60B748] focus:ring-offset-2"
            >
              Login
            </button>

            <!-- Sign Up Link -->
            <p class="mt-6 text-center text-[13px] text-[#35383e]">
              New to ZitraPay?
              <a
                href="/signup.html"
                class="ml-1 font-medium text-[#4E963D] hover:text-[#3d7730] hover:underline transition-colors"
              >
                Sign up
              </a>
            </p>

          </form>

        </div>
      </section>


      <!-- RIGHT SIDE: Graphic Display -->
      <section class="relative hidden lg:flex h-full min-h-screen w-full items-center justify-center p-8 bg-black overflow-hidden">
        
        <!-- Background Image -->
        <img
          src="/images/right side.png"
          alt="Zitra Pay Illustration"
          class="absolute inset-0 h-full w-full object-cover object-center"
        >
        <img/>

      </section>

    </main>
    <script src="/src/main.js"></script>
  </body>
</html>
