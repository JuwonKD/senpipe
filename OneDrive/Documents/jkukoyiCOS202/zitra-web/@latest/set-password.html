<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZitraPay - Set a Password</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#60B748',
              'brand-hover': '#519F3D',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-white font-sans text-[#35383e] antialiased flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="w-full border-b border-gray-100 px-8 py-4 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center">
        <img
          src="/images/logo.png"
          alt="ZitraPay Logo"
          class="h-8 w-auto object-contain"
        />
      </div>

      <!-- Login Nav Link -->
      <div class="flex items-center space-x-3 text-sm">
        <span class="text-gray-600 font-normal">Have an account?</span>
        <a
          href="/login.html"
          class="rounded-full border border-brand px-5 py-1.5 font-medium text-brand hover:bg-brand hover:text-white transition-colors duration-200"
        >
          Login
        </a>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl mx-auto px-6 py-6 flex-1 flex flex-col items-center">
      
      <!-- Progress Bar (100%) -->
      <div class="w-full max-w-3xl bg-gray-100 h-2.5 rounded-full mb-8 overflow-hidden">
        <div class="bg-amber-500 h-full w-full rounded-full"></div>
      </div>

      <!-- Form Section Container -->
      <div class="w-full max-w-[460px] mx-auto">
        
        <!-- Back Button -->
        <a href="/email-verification.html" class="inline-flex items-center text-sm font-medium text-brand hover:text-brand-hover mb-6 transition-colors">
          <svg class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back
        </a>

        <!-- Form Title & Description -->
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">
          Set a password
        </h1>
        <p class="text-sm text-gray-600 mb-8 leading-relaxed">
          Your account has been created! Set a password.
        </p>

        <!-- Form -->
        <form onsubmit="event.preventDefault();" class="space-y-6">
          
          <!-- Password Field -->
          <div>
            <label for="password" class="block text-xs font-medium text-gray-700 mb-1.5">
              Password
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                class="w-full h-12 rounded-xl border border-gray-200 bg-white px-4 pr-11 text-sm text-gray-800 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />
              <button
                type="button"
                class="absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-400 hover:text-gray-600 focus:outline-none"
              >
                <!-- Eye-slash Icon -->
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Password Requirements -->
          <div>
            <p class="text-xs text-gray-600 font-medium mb-2.5">
              Your password should contain at least 8 characters
            </p>
            <div class="flex flex-wrap gap-2 text-[11px] font-medium text-gray-700">
              <span class="px-3 py-1 bg-gray-100 rounded-full">A lowercase</span>
              <span class="px-3 py-1 bg-gray-100 rounded-full">An uppercase</span>
              <span class="px-3 py-1 bg-gray-100 rounded-full">A number</span>
              <span class="px-3 py-1 bg-gray-100 rounded-full">Special characters (@#$)</span>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div>
            <label for="confirmPassword" class="block text-xs font-medium text-gray-700 mb-1.5">
              Confirm Password
            </label>
            <div class="relative">
              <input
                type="password"
                id="confirmPassword"
                class="w-full h-12 rounded-xl border border-gray-200 bg-white px-4 pr-11 text-sm text-gray-800 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />
              <button
                type="button"
                class="absolute inset-y-0 right-0 flex items-center px-3.5 text-gray-400 hover:text-gray-600 focus:outline-none"
              >
                <!-- Eye-slash Icon -->
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms & Conditions Checkbox -->
          <div class="flex items-center space-x-2 pt-1">
            <input
              type="checkbox"
              id="terms"
              class="w-4 h-4 rounded border-gray-300 text-brand focus:ring-brand/20 accent-[#60B748] cursor-pointer"
            />
            <label for="terms" class="text-xs text-gray-700 select-none">
              I agree to ZitraPay’s
              <a href="/terms.html" class="text-brand font-medium hover:underline">
                Terms and conditions
              </a>
            </label>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            onclick="window.location.href='/create-pin.html'"
            class="w-full h-12 mt-4 rounded-xl bg-brand text-sm font-semibold text-white shadow-sm transition-all hover:bg-brand-hover focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 active:scale-[0.99]"
          >
            Submit
          </button>

        </form>

      </div>

    </main>

  </body>
</html>
