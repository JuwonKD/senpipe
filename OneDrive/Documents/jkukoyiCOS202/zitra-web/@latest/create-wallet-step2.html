<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZitraPay - Create Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#60B748',
              'brand-hover': '#519F3D',
              'brand-dark': '#1B3A1F',
              'brand-darker': '#12290F',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-white font-sans text-[#35383e] antialiased">

    <!-- Header -->
    <header class="w-full px-6 sm:px-8 py-4 flex items-center justify-between">
      <img src="/images/logo.png" alt="ZitraPay Logo" class="h-8 w-auto object-contain" />
      <div class="text-sm">
        <span class="text-gray-900 font-medium">Enter your BVN</span>
        <span class="text-amber-500 font-semibold ml-1">2/2</span>
      </div>
    </header>

    <!-- Progress bar (2 segments, both filled) -->
    <div class="w-full flex gap-1.5 px-0">
      <div class="h-1.5 flex-1 bg-amber-500"></div>
      <div class="h-1.5 flex-1 bg-amber-500"></div>
    </div>

    <!-- Content -->
    <main class="max-w-md mx-auto px-6 pt-10">

      <!-- Back -->
      <a href="/create-wallet.html" class="inline-flex items-center gap-1.5 text-sm font-semibold text-brand hover:text-brand-hover transition-colors mb-6">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Back
      </a>

      <!-- Title -->
      <h1 class="text-xl font-bold text-gray-900 mb-2">Enter your NIN</h1>
      <p class="text-sm text-gray-500 mb-6">Enter your national identification number</p>

      <form onsubmit="event.preventDefault();" class="space-y-6">

        <!-- NIN -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">
            NIN <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            placeholder="00000000000"
            maxlength="11"
            inputmode="numeric"
            class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
          />
        </div>

        <!-- Continue -->
        <button
          type="submit"
          onclick="showCreatingWallet(event)"
          class="w-full h-12 rounded-xl bg-brand text-sm font-semibold text-white shadow-sm transition-all hover:bg-brand-hover focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 active:scale-[0.99]"
        >
          Continue
        </button>

      </form>
    </main>

    <!-- Please Wait modal -->
    <div id="creatingWalletModal" class="hidden fixed inset-0 z-50">
      <div class="absolute inset-0 bg-gray-500/40 backdrop-blur-sm"></div>
      <div class="relative min-h-screen flex items-center justify-center px-4">
        <div class="relative w-full max-w-sm rounded-2xl bg-white p-8 shadow-xl text-center">

          <!-- Close button -->
          <button onclick="closeCreatingWalletModal()" aria-label="Close" class="absolute top-4 right-4 h-8 w-8 rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <h2 class="text-lg font-bold text-gray-900 mb-1">Please Wait...</h2>
          <p class="text-sm text-gray-500 mb-5">We are creating your wallet account.</p>

          <svg class="mx-auto h-8 w-8 animate-spin text-brand" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>

        </div>
      </div>
    </div>

    <!-- Wallet Ready modal -->
    <div id="walletReadyModal" class="hidden fixed inset-0 z-50">
      <div onclick="closeWalletReadyModal()" class="absolute inset-0 bg-gray-500/40 backdrop-blur-sm"></div>
      <div class="relative min-h-screen flex items-center justify-center px-4">
        <div class="relative w-full max-w-sm rounded-2xl bg-white p-8 shadow-xl text-center">

          <!-- Close button -->
          <button onclick="closeWalletReadyModal()" aria-label="Close" class="absolute top-4 right-4 h-8 w-8 rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>

          <!-- Icon -->
          <div class="flex justify-center mb-5">
            <div class="h-14 w-14 rounded-full bg-brand flex items-center justify-center ring-8 ring-brand/10">
              <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
              </svg>
            </div>
          </div>

          <h2 class="text-lg font-bold text-gray-900 mb-2">Your Zitra Wallet is ready</h2>
          <p class="text-sm text-gray-500 leading-relaxed mb-6">
            You can now start receiving payments in wallet using your account details
          </p>

          <button onclick="window.location.href='/wallets2.html'" class="w-full h-12 rounded-xl bg-brand text-sm font-semibold text-white shadow-sm transition-all hover:bg-brand-hover focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 active:scale-[0.99]">
            View Account details
          </button>

        </div>
      </div>
    </div>

    <script>
      function showCreatingWallet(e) {
        e.preventDefault();
        document.getElementById('creatingWalletModal').classList.remove('hidden');
        document.body.classList.add('overflow-hidden');
        setTimeout(function () {
          document.getElementById('creatingWalletModal').classList.add('hidden');
          document.getElementById('walletReadyModal').classList.remove('hidden');
        }, 2200);
      }
      function closeCreatingWalletModal() {
        document.getElementById('creatingWalletModal').classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }
      function closeWalletReadyModal() {
        document.getElementById('walletReadyModal').classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
      }
    </script>

  </body>
</html>
