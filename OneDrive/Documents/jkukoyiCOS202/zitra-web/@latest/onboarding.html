<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZitraPay - Individual Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#60B748',
              'brand-hover': '#519F3D',
              'brand-dark': '#1B3A1F',
              'brand-darker': '#12290F',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-gray-50 font-sans text-[#35383e] antialiased">

    <!-- Header -->
    <header class="w-full bg-white border-b border-gray-100 px-6 sm:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="/images/logo.png" alt="ZitraPay Logo" class="h-8 w-auto object-contain" />
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500">Need help?</span>
        <a href="#" class="font-semibold text-brand hover:text-brand-hover transition-colors">Contact Support</a>
      </div>
    </header>

    <!-- Page content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">

      <!-- Back + Title -->
      <a href="/dashboard.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-900 mb-1 hover:text-brand transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Individual Onboarding
      </a>
      <p class="text-sm text-gray-500 mb-6">Kindly provide the information below:</p>

      <div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6">

        <!-- Steps sidebar -->
        <aside class="rounded-2xl border border-gray-100 bg-white p-5 h-fit">
          <div class="flex items-center justify-between mb-5">
            <span class="text-xs font-bold tracking-wide text-gray-900">STEPS</span>
            <span class="text-xs text-gray-400">1/4</span>
          </div>

          <ol class="space-y-5">
            <!-- Step 1 - active -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full border-2 border-brand text-brand text-xs font-bold flex items-center justify-center">1</span>
              <div>
                <p class="text-sm font-semibold text-brand">Individual Information</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-amber-600 bg-amber-100 rounded-full px-2 py-0.5">In progress</span>
              </div>
            </li>
            <!-- Step 2 -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full border-2 border-gray-200 text-gray-400 text-xs font-bold flex items-center justify-center">2</span>
              <div>
                <p class="text-sm font-semibold text-gray-400">Financial Information</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-gray-400 bg-gray-100 rounded-full px-2 py-0.5">Locked</span>
              </div>
            </li>
            <!-- Step 3 -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full border-2 border-gray-200 text-gray-400 text-xs font-bold flex items-center justify-center">3</span>
              <div>
                <p class="text-sm font-semibold text-gray-400">Upload Documents</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-gray-400 bg-gray-100 rounded-full px-2 py-0.5">Locked</span>
              </div>
            </li>
            <!-- Step 4 -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full border-2 border-gray-200 text-gray-400 text-xs font-bold flex items-center justify-center">4</span>
              <div>
                <p class="text-sm font-semibold text-gray-400">Attestation</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-gray-400 bg-gray-100 rounded-full px-2 py-0.5">Locked</span>
              </div>
            </li>
          </ol>
        </aside>

        <!-- Form panel -->
        <section class="rounded-2xl border border-gray-100 bg-white p-6 sm:p-8">
          <h2 class="text-base font-bold text-gray-900 mb-6">Individual Information</h2>

          <form onsubmit="event.preventDefault();" class="space-y-5">

            <!-- First Name -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                First Name <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                value="John"
                class="w-full rounded-lg border border-brand bg-white px-3.5 py-2.5 text-sm text-gray-900 outline-none focus:ring-2 focus:ring-brand/20 transition-all"
              />
            </div>

            <!-- Middle / Last Name -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                  Middle Name <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  placeholder="Duo"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                  Last Name <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  placeholder="Dan"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                />
              </div>
            </div>

            <!-- BVN -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                BVN <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                placeholder="00000000000"
                class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />
            </div>

            <!-- Valid NIN / SSN -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                Valid NIN / SSN <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                placeholder="00000000000"
                class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />
            </div>

            <!-- Mobile Number 1 / 2 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                  Mobile Number 1 <span class="text-red-500">*</span>
                </label>
                <input
                  type="tel"
                  placeholder="000 0000 0000"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Mobile Number 2</label>
                <input
                  type="tel"
                  placeholder="000 0000 0000"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                />
              </div>
            </div>

            <!-- Residential Address -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                Residential Address <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                placeholder="Enter your address"
                class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-300 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />
            </div>

            <!-- City / State -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                  City <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                  State <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  class="w-full rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-900 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                />
              </div>
            </div>

            <!-- Country -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                Country <span class="text-red-500">*</span>
              </label>
              <div class="relative">
                <select
                  class="w-full appearance-none rounded-lg border border-gray-200 bg-white px-3.5 py-2.5 text-sm text-gray-400 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
                >
                  <option value="" selected disabled>Select</option>
                  <option value="NG">Nigeria</option>
                  <option value="US">United States</option>
                  <option value="GB">United Kingdom</option>
                  <option value="CA">Canada</option>
                </select>
                <svg class="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-3 pt-4">
              <button
                type="button"
                class="inline-flex items-center gap-2 rounded-lg bg-brand px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-hover transition-colors"
              >
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-6 4h6m-6 4h6m-9 4h12a2 2 0 002-2V7.5L14.5 3H6a2 2 0 00-2 2v2" />
                </svg>
                Save Progress
              </button>
              <button
                type="submit"
                onclick="window.location.href='/onboarding-step2.html'"
                class="rounded-lg border-2 border-brand px-6 py-2.5 text-sm font-semibold text-brand hover:bg-brand hover:text-white transition-colors"
              >
                Continue
              </button>
            </div>

          </form>
        </section>
      </div>
    </main>

  </body>
</html>
