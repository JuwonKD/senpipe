<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZitraPay - Upload Documents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#60B748',
              'brand-hover': '#519F3D',
              'brand-dark': '#1B3A1F',
              'brand-darker': '#12290F',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-gray-50 font-sans text-[#35383e] antialiased">

    <!-- Header -->
    <header class="w-full bg-white border-b border-gray-100 px-6 sm:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <img src="/images/logo.png" alt="ZitraPay Logo" class="h-8 w-auto object-contain" />
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span class="text-gray-500">Need help?</span>
        <a href="#" class="font-semibold text-brand hover:text-brand-hover transition-colors">Contact Support</a>
      </div>
    </header>

    <!-- Page content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8">

      <!-- Back + Title -->
      <a href="/dashboard.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-900 mb-1 hover:text-brand transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        Individual Onboarding
      </a>
      <p class="text-sm text-gray-500 mb-6">Kindly provide the information below:</p>

      <div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6">

        <!-- Steps sidebar -->
        <aside class="rounded-2xl border border-gray-100 bg-white p-5 h-fit">
          <div class="flex items-center justify-between mb-5">
            <span class="text-xs font-bold tracking-wide text-gray-900">STEPS</span>
            <span class="text-xs text-gray-400">3/4</span>
          </div>

          <ol class="space-y-5">
            <!-- Step 1 - complete -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full bg-brand text-white text-xs font-bold flex items-center justify-center">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </span>
              <div>
                <p class="text-sm font-semibold text-gray-900">Individual Information</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-white bg-brand rounded-full px-2 py-0.5">Complete</span>
              </div>
            </li>
            <!-- Step 2 - complete -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full bg-brand text-white text-xs font-bold flex items-center justify-center">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
              </span>
              <div>
                <p class="text-sm font-semibold text-gray-900">Financial Information</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-white bg-brand rounded-full px-2 py-0.5">Complete</span>
              </div>
            </li>
            <!-- Step 3 - active -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full border-2 border-brand text-brand text-xs font-bold flex items-center justify-center">3</span>
              <div>
                <p class="text-sm font-semibold text-brand">Upload Documents</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-amber-600 bg-amber-100 rounded-full px-2 py-0.5">In progress</span>
              </div>
            </li>
            <!-- Step 4 -->
            <li class="flex items-start gap-3">
              <span class="h-7 w-7 shrink-0 rounded-full border-2 border-gray-200 text-gray-400 text-xs font-bold flex items-center justify-center">4</span>
              <div>
                <p class="text-sm font-semibold text-gray-400">Attestation</p>
                <span class="inline-block mt-1 text-[10px] font-semibold text-gray-400 bg-gray-100 rounded-full px-2 py-0.5">Locked</span>
              </div>
            </li>
          </ol>
        </aside>

        <!-- Form panel -->
        <section class="rounded-2xl border border-gray-100 bg-white p-6 sm:p-8">

          <!-- Back link -->
          <a href="/onboarding-step2.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand hover:text-brand-hover transition-colors mb-4">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back
          </a>

          <h2 class="text-base font-bold text-gray-900 mb-6">Upload Documents</h2>

          <form onsubmit="event.preventDefault();" class="space-y-5">

            <!-- Valid Government ID -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                Valid Government ID (Drivers License or Int'l Passport) <span class="text-red-500">*</span>
              </label>
              <label class="flex items-center gap-3 rounded-lg border border-dashed border-gray-200 bg-white px-4 py-3.5 cursor-pointer hover:border-brand/40 transition-colors">
                <input type="file" accept=".png,.jpg,.jpeg,.pdf" class="hidden" />
                <span class="h-9 w-9 shrink-0 rounded-full bg-brand/10 flex items-center justify-center">
                  <svg class="w-4 h-4 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M12 12v9m0-9l-3 3m3-3l3 3" />
                  </svg>
                </span>
                <span class="text-sm">
                  <span class="font-semibold text-brand">Click to upload</span>
                  <span class="block text-xs text-gray-400">PNG, JPG, and PDF are Allowed.</span>
                </span>
              </label>
            </div>

            <!-- Valid Proof of Address -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                Valid Proof of Address <span class="text-red-500">*</span>
              </label>
              <label class="flex items-center gap-3 rounded-lg border border-dashed border-gray-200 bg-white px-4 py-3.5 cursor-pointer hover:border-brand/40 transition-colors">
                <input type="file" accept=".png,.jpg,.jpeg,.pdf" class="hidden" />
                <span class="h-9 w-9 shrink-0 rounded-full bg-brand/10 flex items-center justify-center">
                  <svg class="w-4 h-4 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M12 12v9m0-9l-3 3m3-3l3 3" />
                  </svg>
                </span>
                <span class="text-sm">
                  <span class="font-semibold text-brand">Click to upload</span>
                  <span class="block text-xs text-gray-400">PNG, JPG, and PDF are Allowed.</span>
                </span>
              </label>
            </div>

            <!-- Proof of Source of Funds & Wealth -->
            <div>
              <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                Proof of Source of Funds &amp; Wealth (A Recent 3 - 6 Months Bank Statement Till Date) <span class="text-red-500">*</span>
              </label>
              <label class="flex items-center gap-3 rounded-lg border border-dashed border-gray-200 bg-white px-4 py-3.5 cursor-pointer hover:border-brand/40 transition-colors">
                <input type="file" accept=".png,.jpg,.jpeg,.pdf" class="hidden" />
                <span class="h-9 w-9 shrink-0 rounded-full bg-brand/10 flex items-center justify-center">
                  <svg class="w-4 h-4 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M12 12v9m0-9l-3 3m3-3l3 3" />
                  </svg>
                </span>
                <span class="text-sm">
                  <span class="font-semibold text-brand">Click to upload</span>
                  <span class="block text-xs text-gray-400">PNG, JPG, and PDF are Allowed.</span>
                </span>
              </label>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-3 pt-4">
              <button
                type="button"
                class="inline-flex items-center gap-2 rounded-lg bg-brand px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-hover transition-colors"
              >
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-6 4h6m-6 4h6m-9 4h12a2 2 0 002-2V7.5L14.5 3H6a2 2 0 00-2 2v2" />
                </svg>
                Save Progress
              </button>
              <button
                type="submit"
                onclick="window.location.href='/onboarding-step4.html'"
                class="rounded-lg border-2 border-brand px-6 py-2.5 text-sm font-semibold text-brand hover:bg-brand hover:text-white transition-colors"
              >
                Continue
              </button>
            </div>

          </form>
        </section>
      </div>
    </main>

    <script>
      // Show the selected filename in place of the upload prompt
      document.querySelectorAll('input[type="file"]').forEach(function (input) {
        input.addEventListener('change', function () {
          const label = input.closest('label');
          const textWrap = label.querySelector('span.text-sm');
          if (input.files && input.files.length > 0) {
            textWrap.innerHTML =
              '<span class="font-semibold text-gray-900">' + input.files[0].name + '</span>' +
              '<span class="block text-xs text-brand">Click to replace</span>';
            label.classList.remove('border-dashed', 'border-gray-200');
            label.classList.add('border-solid', 'border-brand');
          }
        });
      });
    </script>

  </body>
</html>
