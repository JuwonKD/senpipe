<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZitraPay - Business Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#60B748',
              'brand-hover': '#519F3D',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-white font-sans text-[#35383e] antialiased flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="w-full border-b border-gray-100 px-8 py-4 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center">
        <img
          src="/images/logo.png"
          alt="ZitraPay Logo"
          class="h-8 w-auto object-contain"
        />
      </div>

      <!-- Login Nav Link -->
      <div class="flex items-center space-x-3 text-sm">
        <span class="text-gray-600 font-normal">Have an account?</span>
        <a
          href="/login.html"
          class="rounded-full border border-brand px-5 py-1.5 font-medium text-brand hover:bg-brand hover:text-white transition-colors duration-200"
        >
          Login
        </a>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-4xl mx-auto px-6 py-6 flex-1 flex flex-col items-center">
      
      <!-- Progress Bar (50%) -->
      <div class="w-full max-w-3xl bg-gray-100 h-2.5 rounded-full mb-8 overflow-hidden">
        <div class="bg-amber-500 h-full w-1/2 rounded-full"></div>
      </div>

      <!-- Form Section Container -->
      <div class="w-full max-w-[460px] mx-auto">
        
        <!-- Back Button -->
        <a href="/signup.html" class="inline-flex items-center text-sm font-medium text-brand hover:text-brand-hover mb-6 transition-colors">
          <svg class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back
        </a>

        <!-- Form Title -->
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-8">
          Let’s get to know you
        </h1>

        <!-- Form -->
        <form onsubmit="event.preventDefault();" class="space-y-5">
          
          <!-- First Name & Last Name Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            
            <!-- First Name Field -->
            <div>
              <label for="firstName" class="block text-xs font-medium text-gray-700 mb-1.5">
                First Name
              </label>
              <input
                type="text"
                id="firstName"
                placeholder="John"
                class="w-full h-12 rounded-xl border border-brand bg-white px-4 text-sm text-gray-800 placeholder:text-gray-400 outline-none focus:ring-2 focus:border-brand focus:ring-brand/20 transition-all"
              />
            </div>

            <!-- Last Name Field -->
            <div>
              <label for="lastName" class="block text-xs font-medium text-gray-700 mb-1.5">
                Last Name
              </label>
              <input
                type="text"
                id="lastName"
                placeholder="Duo"
                class="w-full h-12 rounded-xl border border-brand border-gray-200 bg-white px-4 text-sm text-gray-800 placeholder:text-gray-400 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />
            </div>

          </div>

          <!-- Business Name Field -->
          <div>
            <label for="businessName" class="block text-xs font-medium text-gray-700 mb-1.5">
              Business Name
            </label>
            <input
              type="text"
              id="businessName"
              placeholder="placeholder@mail.com"
              class="w-full h-12 rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-800 placeholder:text-gray-400 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
            />
          </div>

          <!-- Industry Dropdown Field -->
          <div>
            <label for="industry" class="block text-xs font-medium text-gray-700 mb-1.5">
              Industry
            </label>
            <div class="relative">
              <select
                id="industry"
                class="w-full h-12 appearance-none rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-500 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              >
                <option value="" disabled selected>Select</option>
                <option value="technology">Technology & Software</option>
                <option value="ecommerce">E-Commerce & Retail</option>
                <option value="finance">Financial Services</option>
                <option value="logistics">Logistics & Supply Chain</option>
                <option value="other">Other</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Work Email Field -->
          <div>
            <label for="workEmail" class="block text-xs font-medium text-gray-700 mb-1.5">
              Work Email
            </label>
            <input
              type="email"
              id="workEmail"
              placeholder="placeholder@mail.com"
              class="w-full h-12 rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-800 placeholder:text-gray-400 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
            />
          </div>

          <!-- Mobile Number Field with Country Selector -->
          <div>
            <label for="mobile" class="block text-xs font-medium text-gray-700 mb-1.5">
              Mobile Number
            </label>
            <div class="flex space-x-3">
              
              <!-- Country Code Selector -->
              <div class="relative flex-shrink-0">
                <button
                  type="button"
                  class="h-12 px-3 rounded-xl border border-gray-200 bg-white flex items-center space-x-2 text-sm text-gray-700 hover:border-gray-300 focus:outline-none"
                >
                  <span class="inline-block w-5 h-3.5 overflow-hidden rounded-sm bg-green-600 relative">
                    <span class="absolute inset-y-0 left-1/3 right-1/3 bg-white"></span>
                  </span>
                  <span class="font-medium text-xs">NG</span>
                  <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </button>
              </div>

              <!-- Phone Input -->
              <input
                type="tel"
                id="mobile"
                placeholder="000 000 0000"
                class="w-full h-12 rounded-xl border border-gray-200 bg-white px-4 text-sm text-gray-800 placeholder:text-gray-400 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all"
              />

            </div>
          </div>

          <!-- Continue Button -->
          <button
            type="submit"
            onclick="window.location.href='/email-verification.html'"
            class="w-full h-12 mt-4 rounded-xl bg-brand text-sm font-semibold text-white shadow-sm transition-all hover:bg-brand-hover focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2 active:scale-[0.99]"
          >
            Continue
          </button>

        </form>

      </div>

    </main>

  </body>
</html>
