<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/output.css">
    <title>Forgot Password</title>
</head>
<body class="font-poppins">
    <main
        class="
            min-h-screen
            grid
            grid-cols-1
            lg:grid-cols-2
            items-center
            justify-center
            gap-8
            px-6
            py-10
            lg:px-16
            lg:py-0
        "
    >
     <section>
       <div class="w-full max-w-[405px]">
            <img src="/images/logo.png" alt="ZitraPay Logo" class="h-auto
                    w-[60px]
                    mb-10">
       </div>
       <h1 class="mb-2
                    text-[28px]
                    font-semibold
                    text-[#35383e]">
                    Forgot Password
        </h1>
        <p class="mb-10">
                Enter your email address to get instructions for resetting your password.
        </p>    
        <label for="email" class="block mb-2 text-sm font-medium text-gray-900 ">Email Address</label>
        <input type="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg outline-none focus:ring-[#60B748] focus:border-[#60B748] block w-full p-2.5 " placeholder="placeholder@mail.com" required>
        <button type="submit" class="h-[50px] w-full bg-[#60B748] text-white rounded-[12px] mt-10">Continue</button>
        <a href="/index.html" class="text-[#60B748] hover:underline mt-10 block"> &lt;   Return to Login</a>
     </section> 
    
     <section class=" lg:flex justify-center items-center w-full">
        <img src="/images/right side.png" alt="Login Illustration" class="w-full object-contain max-w-[650px] rounded-2xl h-auto">
     </section>
    </main>
    <script src="/src/main.js"></script>
</body>
</html>
