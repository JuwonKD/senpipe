<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZitraPay - Setting Up Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#60B748',
              'brand-hover': '#519F3D',
            },
          },
        },
      }
    </script>
  </head>
  <body class="min-h-screen bg-white font-sans text-[#35383e] antialiased flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="w-full border-b border-gray-100 px-8 py-4 flex items-center justify-between">
      <!-- Logo -->
      <div class="flex items-center">
        <img
          src="/images/logo.png"
          alt="ZitraPay Logo"
          class="h-8 w-auto object-contain"
        />
      </div>
    </header>

    <!-- Main Loading Content -->
    <main class="w-full max-w-xl mx-auto px-6 flex-1 flex flex-col items-center justify-center text-center -mt-16">
      
      <!-- Title & Subtitle -->
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">
        Great first step
      </h1>
      <p class="text-sm text-gray-600 mb-6">
        Please wait while we setup your account
      </p>

      <!-- Animated Green Spinner -->
      <div class="relative flex items-center justify-center">
        <div class="w-9 h-9 border-4 border-emerald-100 border-t-brand rounded-full animate-spin"></div>
      </div>

    </main>

    <!-- Footer Spacer -->
    <footer class="py-4"></footer>

    <!-- Optional JavaScript to redirect to Dashboard after setup -->
    <script>
      // Automatically redirect to the next page after 3 seconds
      setTimeout(() => {
        window.location.href = '/dashboard.html';
      }, 3000);
    </script>

  </body>
</html>
