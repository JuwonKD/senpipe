<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZitraPay - Landing Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="landing-body">

    <main class="landing-page">

        <!-- LEFT SIDE -->
        <section class="landing-form-side">

            <!-- Logo -->
            <div class="landing-logo">
                <img src="logo.png" alt="ZitraPay Logo">
            </div>

            <!-- Login form -->
            <div class="landing-content">

                <h1>Log In</h1>

                <!-- Email -->
                <div class="landing-input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="placeholder@mail.com"
                    >

                </div>

                <!-- Password -->
                <div class="landing-input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="landing-password-box">

                        <input
                            type="password"
                            id="password"
                        >

                        <!-- Password eye icon -->
                        <button
                            type="button"
                            id="toggle-password"
                            class="landing-eye-button"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>

                <!-- Forgot password -->
                <a
                    href="forgot-password.html"
                    class="landing-forgot-password"
                >
                    Forgot your password?
                </a>

                <!-- Login button -->
                <button
                    type="button"
                    id="login-button"
                    class="landing-login-button"
                >
                    Login
                </button>

                <!-- Sign-up -->
                <p class="landing-signup-text">

                    New to ZitraPay?

                    <a href="signup.html">
                        Sign up
                    </a>

                </p>

            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="landing-image-side">
            
            <img src="landing-image.png" alt="Landing Page Image" class="landing-right-image">
            

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
